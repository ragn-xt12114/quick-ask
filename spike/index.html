<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';"
    />
    <title>QuickAsk G1 spike</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      body {
        position: relative;
        font-family: system-ui, "Noto Sans CJK SC", "Noto Sans", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }

      #card {
        position: absolute;
        left: 40px;
        top: 28px;
        width: 680px;
        height: 48px;
        box-sizing: border-box;
        border-radius: 24px;
        background: rgba(28, 30, 32, 0.72);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        color: #ffffff;
        display: flex;
        align-items: center;
        padding: 0 22px;
        font-size: 17px;
        line-height: 1;
        letter-spacing: 0.2px;
        white-space: nowrap;
      }

      #label {
        font-weight: 600;
      }

      #hint {
        margin-left: 14px;
        font-size: 12px;
        font-weight: 400;
        opacity: 0.62;
      }

      /* Compositor-off / opaque fallback: no transparency, no gutter, no shadow. */
      html.opaque,
      html.opaque body {
        background: #1c1e20;
      }

      html.opaque #card {
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        border-radius: 0;
        background: #1c1e20;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <span id="label">QuickAsk G1 spike</span>
      <span id="hint">transparent · rounded · shadow gutter</span>
    </div>
    <script>
      if (location.search.includes('opaque=1')) {
        document.documentElement.classList.add('opaque');
        document.getElementById('hint').textContent = 'opaque fallback';
      }
    </script>
  </body>
</html>
