<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none';"
    />
    <title>QuickAsk G6 IME spike</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      body {
        font-family: system-ui, "Noto Sans CJK SC", "Noto Sans", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }

      #card {
        position: absolute;
        left: 40px;
        top: 28px;
        width: 680px;
        height: 48px;
        box-sizing: border-box;
        border-radius: 24px;
        background: rgba(28, 30, 32, 0.82);
        color: #ffffff;
        display: flex;
        align-items: center;
        /* Known left padding: the input content box starts at window x=62. */
        padding: 0 22px;
        font-size: 17px;
        line-height: 1;
        white-space: nowrap;
      }

      #composer {
        flex: 1 1 auto;
        min-width: 0;
        height: 30px;
        border: 0;
        outline: none;
        background: transparent;
        color: #ffffff;
        font: inherit;
        letter-spacing: 0.2px;
        caret-color: #7cc4ff;
      }

      #composer::placeholder {
        color: rgba(255, 255, 255, 0.42);
      }

      #state {
        margin-left: 12px;
        font-size: 12px;
        opacity: 0.6;
        min-width: 92px;
        text-align: right;
      }

      #status {
        position: absolute;
        left: 44px;
        top: 86px;
        width: 672px;
        box-sizing: border-box;
        color: rgba(255, 255, 255, 0.72);
        font-size: 12px;
        line-height: 16px;
        letter-spacing: 0.2px;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <input
        id="composer"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="Ask anything…"
      />
      <div id="state">idle</div>
    </div>
    <div id="status">G6 fcitx5 IME spike — input left padding 22px, card 680×48</div>
  </body>
</html>
